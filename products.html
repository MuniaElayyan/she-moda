<!DOCTYPE html>
<html lang="ar" dir="rtl" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- بيانات الصفحة لمحركات البحث -->
    <title>المنتجات | She Moda</title>
    <meta name="description"
        content="تصفحي أقسام متجر She Moda: جلابيب، عبايات، فساتين، قفاطين، أطقم رسمية، قمصان، بلايز، بناطيل، تنانير، مكملات الحجاب، أطقم صلاة، بيجامات، ملابس داخلية، وعطور ومنتجات عناية.">
    <meta name="theme-color" content="#d46d9d">

    <link rel="icon" type="image/png" href="Untitled.png">
    <link rel="apple-touch-icon" href="Untitled.png">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="She Moda">
    <meta property="og:locale" content="ar_AR">
    <meta property="og:title" content="المنتجات | She Moda">
    <meta property="og:description" content="تشكيلة She Moda الكاملة من الأزياء النسائية ومكملات الحجاب والعطور.">
    <meta property="og:image" content="logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Allura&family=Cairo:wght@300;400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/theme.js"></script>
</head>

<body class="bg-white font-sans text-ink-900 antialiased" data-page="products">

    <div id="site-header-root"></div>

    <main id="main">

        <!-- ==============================================================
             ترويسة الصفحة
             ============================================================== -->
        <section class="relative overflow-hidden bg-gradient-to-b from-blush-50 to-white py-16 lg:py-20">
            <div class="pointer-events-none absolute -top-20 -start-16 h-64 w-64 rounded-full bg-blush-200/50 blur-3xl"
                aria-hidden="true"></div>

            <div class="relative mx-auto max-w-content px-4 text-center sm:px-6 lg:px-8">
                <p class="inline-flex items-center gap-2 rounded-full bg-white/80 px-4 py-1.5 text-xs font-bold uppercase tracking-[0.25em] text-blush-600 ring-1 ring-blush-100">
                    المتجر
                </p>
                <h1 class="mt-5 text-3xl font-extrabold leading-tight tracking-tight text-ink-900 sm:text-4xl lg:text-5xl">
                    اكتشفي مجموعاتنا
                </h1>
                <p class="mx-auto mt-5 max-w-2xl text-[15px] leading-9 text-ink-500 sm:text-[17px]">
                    اختاري القسم الذي ترغبين بتصفحه، وستجدين كل قطعة بصورتها وسعرها،
                    مع إمكانية الاستفسار عنها مباشرة عبر واتساب.
                </p>
                <div class="mt-7 flex items-center justify-center gap-3" aria-hidden="true">
                    <span class="h-px w-16 bg-gradient-to-l from-blush-300 to-transparent"></span>
                    <span class="h-2 w-2 rotate-45 rounded-[2px] bg-blush-300"></span>
                    <span class="h-px w-16 bg-gradient-to-r from-blush-300 to-transparent"></span>
                </div>
            </div>
        </section>

        <!-- ==============================================================
             الحالة الأولى: شبكة الأقسام (تُدار من js/catalog.js)
             ============================================================== -->
        <section id="catalog-categories" class="scroll-mt-28 pb-24">
            <div class="mx-auto max-w-content px-4 sm:px-6 lg:px-8">
                <!-- كروت الأقسام تُبنى من js/data/categories.js -->
                <h2 class="sr-only">أقسام المتجر</h2>
                <div id="category-grid"
                    class="grid grid-cols-2 gap-4 sm:gap-6 md:grid-cols-3 lg:grid-cols-4 lg:gap-7"></div>
            </div>
        </section>

        <!-- ==============================================================
             الحالة الثانية: منتجات قسم واحد (تظهر عند فتح products.html#slug)
             ============================================================== -->
        <section id="catalog-products" class="hidden scroll-mt-24 pb-24">
            <div class="mx-auto max-w-content px-4 sm:px-6 lg:px-8">

                <!-- زر العودة وعنوان القسم -->
                <div class="flex flex-col gap-6 border-b border-blush-100 pb-8 sm:flex-row sm:items-end sm:justify-between">
                    <div>
                        <h2 id="catalog-title"
                            class="text-3xl font-extrabold tracking-tight text-ink-900 sm:text-4xl"></h2>
                        <p id="catalog-count" class="mt-2 text-sm font-semibold text-ink-500"></p>
                    </div>

                    <button type="button" id="catalog-back"
                        class="inline-flex shrink-0 items-center justify-center gap-2 self-start rounded-full bg-white px-6 py-3 text-sm font-semibold text-blush-700 ring-1 ring-blush-200 transition-all duration-300 hover:-translate-y-0.5 hover:bg-blush-50 hover:ring-blush-400 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-blush-300/70 motion-reduce:transition-none sm:self-auto">
                        <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor"
                            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M9 6l6 6-6 6" />
                        </svg>
                        العودة للأقسام
                    </button>
                </div>

                <!-- شريط تنقّل سريع بين الأقسام -->
                <nav aria-label="التنقل بين الأقسام" class="-mx-4 mt-6 overflow-x-auto px-4 pb-2 sm:mx-0 sm:px-0">
                    <div id="catalog-chips" class="flex w-max gap-2"></div>
                </nav>

                <!-- كروت المنتجات تُبنى من js/data/products.js -->
                <div id="product-grid"
                    class="mt-10 grid grid-cols-1 gap-5 min-[420px]:grid-cols-2 sm:gap-6 lg:grid-cols-3 xl:grid-cols-4"></div>

                <!-- دعوة للاستفسار أسفل القسم -->
                <div class="mt-14 rounded-[32px] bg-blush-50 p-8 text-center ring-1 ring-blush-100 sm:p-12"
                    data-reveal>
                    <h3 class="text-2xl font-extrabold text-ink-900 sm:text-3xl">
                        لم تجدي ما تبحثين عنه؟
                    </h3>
                    <p class="mx-auto mt-4 max-w-xl text-[15px] leading-9 text-ink-500">
                        تصلنا قطع جديدة باستمرار. راسلينا على واتساب واسألينا عن المقاس أو اللون
                        الذي تريدينه.
                    </p>
                    <div class="mt-7 flex flex-wrap justify-center gap-3">
                        <a data-whatsapp data-whatsapp-text="مرحبًا She Moda، أريد الاستفسار عن أحد المنتجات."
                            class="inline-flex cursor-pointer items-center justify-center gap-2 rounded-full bg-blush-500 px-7 py-3.5 text-[15px] font-semibold text-white shadow-soft transition-all duration-300 hover:-translate-y-0.5 hover:bg-blush-600 hover:shadow-lift focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-blush-300/70 motion-reduce:transition-none">
                            اسألي عن منتج
                        </a>
                        <a href="contact.html"
                            class="inline-flex items-center justify-center gap-2 rounded-full bg-white px-7 py-3.5 text-[15px] font-semibold text-blush-700 ring-1 ring-blush-200 transition-all duration-300 hover:-translate-y-0.5 hover:bg-blush-50 hover:ring-blush-400 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-blush-300/70 motion-reduce:transition-none">
                            تواصلي معنا
                        </a>
                    </div>
                </div>

            </div>
        </section>

    </main>

    <div id="site-footer-root"></div>

    <script src="js/data/site.js"></script>
    <script src="js/data/categories.js"></script>
    <script src="js/data/products.js"></script>
    <script src="js/data/content.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/cards.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/lightbox.js"></script>
    <script src="js/catalog.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
